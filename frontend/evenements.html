<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sensei">
  <meta name="theme-color" content="#08080A">
  <title>Sensei — Objectifs</title>
  <link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <div class="ligne entre"><h1>Objectifs</h1><span id="mode"></span></div>

  <div class="carte" style="padding:16px" id="timeline"></div>
  <div id="reconstruction"></div>

  <div class="section-label">Objectif principal</div>
  <div id="principal"><div class="squelette"></div></div>

  <div class="section-label">Plan de préparation</div>
  <div id="plan"></div>
  <button type="button" class="btn secondaire-plan" id="reconstruire"><i class="ti ti-refresh"></i>Reconstruire le plan</button>

  <div id="bloc-autres" class="hidden">
    <div class="section-label">Autres objectifs</div>
    <div class="carte" id="autres" style="padding-top:4px;padding-bottom:4px"></div>
  </div>
</main>
<button type="button" class="fab" id="ajouter" aria-label="Ajouter un objectif"><i class="ti ti-plus"></i></button>
<script src="/static/app.js"></script>
<script src="/static/evenements.js"></script>
</body>
</html>
