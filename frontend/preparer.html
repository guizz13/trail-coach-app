<head>
  <meta charset="utf-8">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<main class="preparer">

  </div>
  <div id="etapes"></div>
  <div id="attente"></div>
  <div id="apercu"></div>
  <div class="etapes-pied" id="pied"><button type="button" class="btn principal" id="suivant">Suivant</button></div>

<script src="/static/app.js"></script>
<script src="/static/sport-picker.js"></script>
