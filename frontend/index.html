<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sensei">
  <meta name="theme-color" content="#08080A">
  <title>Sensei — Semaine</title>
  <link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <div class="nav-semaine">
    <button class="btn-icone" id="prec" aria-label="Semaine précédente"><i class="ti ti-chevron-left"></i></button>
    <span id="titre-semaine">Semaine</span>
    <button class="btn-icone" id="suiv" aria-label="Semaine suivante"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="badges" id="badges"></div>
  <div id="objectif-proche"></div>
  <div id="coach"></div>

  <div class="section-label">État de forme</div>
  <div class="grille-2">
    <div class="carte metrique" id="charge"></div>
    <div class="carte metrique" id="zones"></div>
  </div>

  <div class="carte" style="margin-top:8px">
    <div class="ligne entre"><span class="metrique"><span class="label">Volume course (km / semaine)</span></span>
      <span class="secondaire" id="km-semaine"></span></div>
    <div id="g-volume" style="margin-top:10px"></div>
  </div>

  <div class="ligne entre"><div class="section-label">Planning</div>
    <button class="btn petit" id="ajouter" style="margin-top:14px"><i class="ti ti-plus"></i>Séance</button></div>
  <div id="planning"><div class="squelette"></div><div class="squelette"></div><div class="squelette"></div></div>

  <div class="cout" id="cout"></div>
</main>
<script src="/static/app.js"></script>
<script src="/static/semaine.js"></script>
</body>
</html>
