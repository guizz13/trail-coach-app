<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sensei">
  <meta name="theme-color" content="#08080A">
  <title>Sensei — Préparer</title>
  <link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Préparer ta semaine</h1>
  <form id="form">
    <div class="carte">
      <label style="margin-top:0">Semaine du</label>
      <input type="date" name="semaine_debut" required>
    </div>

    <div class="section-label">Squash prévus</div>
    <div class="carte" id="squash"></div>

    <div class="section-label">Contraintes</div>
    <div class="carte">
      <div id="contraintes"></div>
      <button type="button" class="btn petit" id="ajout-contrainte"><i class="ti ti-plus"></i>Contrainte</button>
    </div>

    <div class="section-label">Forme</div>
    <div class="carte">
      <div class="ligne entre"><label style="margin:0">Ressenti</label><span class="chiffre" id="v-ressenti">7</span></div>
      <input type="range" name="ressenti" min="1" max="10" value="7">
      <div class="ligne entre" style="margin-top:10px"><label style="margin:0">Sommeil</label><span class="chiffre" id="v-sommeil">7</span></div>
      <input type="range" name="sommeil" min="1" max="10" value="7">
    </div>

    <div class="section-label">Statut santé</div>
    <div class="carte">
      <div class="segments" id="sante">
        <button type="button" data-v="100%" class="actif">100 %</button>
        <button type="button" data-v="vigilance">Vigilance</button>
        <button type="button" data-v="blessure">Blessure</button>
      </div>
      <div id="zone-sante" class="hidden"><label>Zone concernée</label><input name="zone" placeholder="ex. achille gauche"></div>
    </div>

    <div class="section-label">Notes</div>
    <textarea name="notes" placeholder="Déplacement, fatigue, envie particulière…"></textarea>

    <button type="submit" class="btn principal" id="generer" style="margin-top:16px">Générer ma semaine</button>
  </form>
  <div id="resultat"></div>
</main>
<script src="/static/app.js"></script>
<script src="/static/dimanche.js"></script>
</body>
</html>
