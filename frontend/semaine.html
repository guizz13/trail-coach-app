<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sensei">
  <meta name="theme-color" content="#09090C">
  <title>Sensei — Semaine</title>
  <link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <div class="nav-semaine">
    <button class="btn-icone" id="prec" aria-label="Semaine précédente"><i class="ti ti-chevron-left"></i></button>
    <span id="titre-semaine">Semaine</span>
    <button class="btn-icone" id="suiv" aria-label="Semaine suivante"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div id="bilan-semaine"></div>

  <div class="ligne entre"><div class="section-label">Planning</div>
    <div class="ligne" style="margin-top:14px;gap:6px">
      <button class="btn petit" id="ajouter-realisee"><i class="ti ti-check"></i>Réalisée</button>
      <button class="btn petit" id="ajouter"><i class="ti ti-plus"></i>Séance</button></div></div>
  <div id="planning"><div class="squelette"></div><div class="squelette"></div><div class="squelette"></div></div>
  <div id="reajuster"></div>
  <a class="btn" id="preparer-suivante" href="/preparer" style="margin-top:14px"><i class="ti ti-adjustments"></i>Préparer la semaine prochaine</a>
</main>
<script src="/static/app.js"></script>
<script src="/static/sport-picker.js"></script>
<script src="/static/seance.js"></script>
<script src="/static/semaine.js"></script>
</body>
</html>
