<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sensei">
  <meta name="theme-color" content="#08080A">
  <title>Sensei — Stats</title>
  <link rel="manifest" href="/static/manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Stats</h1>

  <div class="section-label">Volume course</div>
  <div class="carte">
    <div class="grille-2" style="gap:12px">
      <div class="metrique"><div class="label">Moyenne</div><div class="valeur" id="km-moy">—</div><div class="sous-texte">km / semaine</div></div>
      <div class="metrique"><div class="label">Total</div><div class="valeur" id="km-total">—</div><div class="sous-texte" id="dplus-total"></div></div>
    </div>
    <div id="g-volume" style="margin-top:14px"></div>
  </div>

  <div class="section-label">Équilibre de charge</div>
  <div class="carte">
    <div id="g-acwr"></div>
    <div class="sous-texte" id="acwr-note" style="margin-top:6px"></div>
  </div>

  <div class="section-label">Poids</div>
  <div class="carte">
    <div id="g-poids"></div>
    <form id="form-poids" class="ligne" style="margin-top:12px">
      <input type="date" name="date_mesure" style="flex:1.4">
      <input name="poids_kg" inputmode="decimal" placeholder="kg" style="flex:1" required>
      <button type="submit" class="btn principal petit"><i class="ti ti-plus"></i></button>
    </form>
    <div id="err-poids"></div>
  </div>

  <div class="section-label">Musculation</div>
  <div class="carte" id="muscu"></div>

  <div class="section-label">Séances</div>
  <div class="segments" id="familles" style="margin-bottom:8px">
    <button type="button" data-v="" class="actif">Tous</button>
    <button type="button" data-v="course">Course</button>
    <button type="button" data-v="squash">Squash</button>
    <button type="button" data-v="muscu">Muscu</button>
    <button type="button" data-v="velo">Vélo</button>
  </div>
  <div class="carte" id="liste" style="padding-top:4px;padding-bottom:4px"></div>
</main>
<script src="/static/app.js"></script>
<script src="/static/historique.js"></script>
</body>
</html>
